name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres service
        uses: Harmon758/postgres-action@v1.0.3
        with:
          postgresql version: '15'
          postgresql db: testpilot
          postgresql user: testpilot
          postgresql password: testpilot
          postgresql port: 5432

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend requirements + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install alembic pytest-cov flake8

      - name: Set DATABASE_URL env
        run: echo "DATABASE_URL=postgresql+psycopg2://testpilot:testpilot@localhost:5432/testpilot" >> $GITHUB_ENV

      - name: Run Alembic migrations
        working-directory: ./backend
        run: |
          alembic -c alembic.ini upgrade head

      - name: Lint with flake8
        run: |
          flake8 backend || true

      - name: Run backend tests with coverage
        working-directory: ./backend
        run: |
          pytest --cov=app --cov-report=xml -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm run build
